# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Reload config with 'r'
bind C-r source-file ~/.tmux.conf \; display "Config reloaded!"

# Unbind default split keys
unbind '"'
unbind '%'

# Bind new pane split keys
bind '|' split-window -h -c '#{pane_current_path}'
bind '_' split-window -v -c '#{pane_current_path}'

# window movements vim style
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

bind-key -r H resize-pane -L 60
bind-key -r J resize-pane -D 25
bind-key -r K resize-pane -U 25
bind-key -r L resize-pane -R 60

bind C-h resize-pane -L 20
bind C-j resize-pane -D 5
bind C-k resize-pane -U 5
bind C-l resize-pane -R 20

# set message display time. Default is only 750 ms
set-option -g display-time 2000

set -g mouse on

set -g status-style "bg=white,fg=black"

# neovim can update on focus events
set -g focus-events on

# Style status bar
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g status-style "fg=black,bg=green"
set -g window-status-current-style "fg=green,bg=terminal,bold"
